name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 页面手动点一下触发

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 构建并推送到 gh-pages 分支
        run: mkdocs gh-deploy --force
